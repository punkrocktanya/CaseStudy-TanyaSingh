name: Analysis from packaged processed data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - name: Run Tasks 2 to 6 using packaged processed data
        run: |
          for task in 2 3 4 5 6; do python scripts/run_six_tasks.py --task "$task"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battery-analysis-results
          path: |
            scripts/task*/outputs/
            output/pdf/
            Technical_Report.pdf
          if-no-files-found: warn
