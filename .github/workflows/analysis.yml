name: Full analysis and report
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run analysis and record results
        run: |
          python scripts/run_with_report.py stage_04_fit_capacity_fade.py
          python scripts/run_with_report.py 05_compare_capacity_models.py
          python scripts/run_with_report.py 06_differential_voltage.py
          python scripts/run_with_report.py 07_detect_battery_anomalies.py
          python scripts/run_with_report.py stage_08_individual_curve_rul.py
          python scripts/run_with_report.py stage_09_estimate_rul_xgboost_shared.py
          python scripts/run_with_report.py stage_10_estimate_rul_lstm_minimal.py
          python scripts/run_with_report.py 11_build_common_checkpoint_comparison.py
          python scripts/run_with_report.py stage_13_scale_module_pack.py
          python scripts/run_with_report.py 14_build_task6_visualizations.py
          python scripts/run_with_report.py build_short_report.py
      - name: Upload results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-analysis-results
          path: |
            scripts/outputs/execution_reports/
            scripts/outputs/14_reporting_visualization/
            output/pdf/
          if-no-files-found: warn
          retention-days: 14
