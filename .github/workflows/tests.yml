name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: python -m pip install --no-cache-dir "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        run: python -m pip install --no-cache-dir "numpy>=1.26,<3" "pandas>=2.0,<4" "matplotlib>=3.7,<4" "pyarrow>=14,<30" "openpyxl>=3.1,<4" "xgboost>=2.0,<4"
      - name: Check submission integrity
        run: python scripts/validate_submission_integrity.py
      - name: Run unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
